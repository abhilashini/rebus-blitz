<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Rebus Blitz 🎉</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>Emoji Rebus Blitz 🎉</h1>
        <div class="score-display">
            Score: <span id="score">0</span>
        </div>
    </header>

    <main>
        <section id="game-panel">
            <div class="puzzle-display">
                <h2>Decode the Rebus!</h2>
                <div id="puzzle" class="emoji-large">🌊🏄‍♂️</div>
                <div id="hint" class="hint-text">Something surfers do</div>
            </div>

            <div class="timer-display">
                <div class="timer-label">Time Remaining:</div>
                <div id="timer" class="timer-count">30</div>
                <div class="timer-unit">seconds</div>
            </div>

            <form id="answer-form" class="answer-form">
                <label for="answer-input">Your Answer:</label>
                <input type="text" id="answer-input" placeholder="Type your guess..." autocomplete="off">
                <button type="submit">Submit Guess</button>
            </form>

            <div id="feedback" class="feedback" aria-live="polite"></div>
        </section>

        <section id="submit-panel">
            <h2>Submit Your Own Puzzle</h2>
            <form id="submit-form" class="submit-form">
                <div class="form-group">
                    <label for="emoji-input">Emoji String:</label>
                    <input type="text" id="emoji-input" placeholder="e.g., 🌊🏄‍♂️">
                </div>
                
                <div class="form-group">
                    <label for="answer-input-submit">Correct Answer:</label>
                    <input type="text" id="answer-input-submit" placeholder="e.g., surfing">
                </div>
                
                <div class="form-group">
                    <label for="hint-input">Helpful Hint:</label>
                    <input type="text" id="hint-input" placeholder="e.g., Something surfers do">
                </div>
                
                <button type="submit">Submit Puzzle</button>
            </form>

            <div id="submit-feedback" class="feedback" aria-live="polite"></div>
        </section>
    </main>

    <footer>
        <p>Emoji Rebus Blitz v0.1.0</p>
        <p><small>Running in standalone mode. Refresh for new puzzles!</small></p>
    </footer>

    <!-- Use bundled version for testing -->
    <script src="/app-bundled.js"></script>
</body>
</html>
